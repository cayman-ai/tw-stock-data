name: 執行程式
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 要執行的指令（在 repo 根目錄）
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q requests pandas lxml
      - name: 執行
        run: mkdir -p out && ${{ inputs.cmd }} 2>&1 | tee out/log.txt
      - name: 結果推到 scratch 分支
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b scratch && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" scratch
