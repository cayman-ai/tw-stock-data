name: 執行程式
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 要執行的指令（在 repo 根目錄）
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q requests pandas lxml
      - name: 執行
        run: mkdir -p out && ${{ inputs.cmd }} 2>&1 | tee out/log.txt
      - name: 資料存到 data-<run_id> 分支，再嘗試併回 main
        if: always()
        run: |
          git add data/ || true
          if ! git diff --cached --quiet; then
            git -c user.name=tw-stock-data-bot -c user.email=bot@users.noreply.github.com commit -qm "資料更新 run ${{ github.run_id }}"
            git push -q origin HEAD:refs/heads/data-${{ github.run_id }}
            for i in 1 2 3 4 5; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && break; sleep $((i*7)); done || true
          fi
      - name: 結果推到 scratch 分支
        if: always()
        run: |
          cd out && rm -rf .git && git init -q && git checkout -q -b scratch && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:scratch-${{ github.run_id }} && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:scratch || true
