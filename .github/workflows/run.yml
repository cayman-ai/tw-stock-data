name: 執行程式
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 要執行的指令（在 repo 根目錄；抓取指令一律串行，不可在同一指令內平行執行多個抓取）
        required: true
permissions:
  contents: write
concurrency:
  group: tw-stock-data-write
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q requests pandas lxml
      - name: 執行
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          ${{ inputs.cmd }} 2>&1 | tee out/log.txt
      - name: 資料存回 main（只有全部成功才提交）
        if: success()
        run: |
          set -euo pipefail
          git add data/
          if ! git diff --cached --quiet; then
            git -c user.name=tw-stock-data-bot -c user.email=bot@users.noreply.github.com commit -qm "資料更新 run ${{ github.run_id }}"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull -q --rebase --autostash origin main && git push -q origin HEAD:main; then pushed=1; break; fi
              sleep $((i*7))
            done
            if [ "$pushed" != 1 ]; then echo "::error::資料推送到 main 失敗 5 次"; exit 1; fi
          fi
      - name: 結果推到 scratch 分支
        if: always()
        run: |
          cd out && rm -rf .git && git init -q && git checkout -q -b scratch && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:scratch || true
