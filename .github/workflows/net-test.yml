name: 連線測試
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 測試官方網站連線
        run: |
          for u in \
            https://openapi.twse.com.tw/v1/opendata/t187ap05_L \
            https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap05_O \
            https://mops.twse.com.tw/mops/ \
            https://mopsov.twse.com.tw/mops/web/index \
            "https://www.twse.com.tw/exchangeReport/BWIBBU_ALL?response=json" ; do
            code=$(curl -s -o /tmp/o -w '%{http_code}' -m 20 -A "Mozilla/5.0" "$u"); echo "$code $(wc -c </tmp/o) bytes  $u"; head -c 200 /tmp/o; echo; done
